[project]
name = "jutsu-duel-ml"
version = "0.1.0"
description = "Trains the hand-sign classifier for Jutsu Duel and exports it as JSON for the browser."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "torch>=2.4",
  "scikit-learn>=1.5",
]

[project.scripts]
train = "jutsu_ml.train:main"
evaluate = "jutsu_ml.evaluate:main"
prune = "jutsu_ml.prune:main"
references = "jutsu_ml.references:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jutsu_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
