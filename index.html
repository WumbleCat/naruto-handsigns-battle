<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The visible title is also set at runtime from src/content/content.config.ts. -->
    <title>Jutsu Duel</title>
    <script>
      // Apply the cached theme before first paint so the page never flashes the wrong one.
      // Mirrors src/app/providers/ThemeProvider.tsx; the key matches src/lib/settings/store.ts.
      (function () {
        try {
          var raw = localStorage.getItem('jutsu-duel.settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          /* storage blocked: keep the default dark theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
